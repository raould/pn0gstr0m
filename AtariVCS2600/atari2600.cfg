# Atari 2600 Linker Configuration (cc65)
# This file defines memory layout for the Atari 2600 cartridge

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0080;  # 128 bytes stack
}

MEMORY {
    # Zero page RAM (128 bytes)
    ZP:     file = "", start = $0080, size = $0080, type = rw;
    
    # Cartridge RAM (for bitmap buffer)
    # Assuming a modern cartridge with extra RAM
    # Standard carts: use ZP only
    # Supercharger/modern: up to 6KB
    CARTRAM: file = "", start = $F000, size = $0400, type = rw;  # 1KB RAM
    
    # ROM (4KB standard cartridge)
    # Mapped at $F000-$FFFF
    ROM:    file = %O, start = $F000, size = $1000, type = ro, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    DATA:     load = CARTRAM, type = rw;        # Bitmap buffer goes here
    BSS:      load = CARTRAM, type = bss;
    CODE:     load = ROM,     type = ro;
    RODATA:   load = ROM,     type = ro;
    VECTORS:  load = ROM,     type = ro, start = $FFFA;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

# Notes:
# - Atari 2600 has 128 bytes RAM at $0080-$00FF (zero page)
# - Standard carts are ROM only (2K or 4K)
# - Modern homebrew carts can have additional RAM
# - For bitmap buffer (576 bytes), need cart with RAM
# - Alternative: Use bankswitching to fake more memory
